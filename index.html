<script>
const playLink = document.getElementById('play-store-link');
playLink.addEventListener('click', function (event) {
  const options = { send_to: 'AW-18434678759/9GQeCP_Dq70dEOe_q9ZE' };
  if (!event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey) {
    event.preventDefault();
    let navigated = false;
    function openPlayStore() {
      if (navigated) return;
      navigated = true;
      window.location.assign(playLink.href);
    }
    setTimeout(openPlayStore, 1000);
    options.event_callback = openPlayStore;

  gtag('event', 'conversion', options);
});
